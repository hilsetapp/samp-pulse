name: snapshot

# Делает две вещи:
# 1) снимает свежий список серверов и дописывает историю в ветку data;
# 2) собирает сайт вместе с этими данными и публикует на GitHub Pages.
# Так браузер берёт данные с того же домена, что и саму страницу.
# Запускается каждые 15 минут (по возможности), по push в main и руками.

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: снимок и история
    runs-on: ubuntu-latest
    steps:
      - name: Код (ветка main)
        uses: actions/checkout@v4
        with:
          path: app

      - name: Данные (ветка data или с нуля)
        env:
          TK: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          if git clone -q --branch data "https://x-access-token:${TK}@github.com/${REPO}.git" data 2>/dev/null; then
            echo "ветка data найдена, продолжаем историю"
          else
            echo "ветки data нет - создаём с нуля"
            rm -rf data
            mkdir -p data
            git -C data init -q -b data
            git -C data remote add origin "https://x-access-token:${TK}@github.com/${REPO}.git"
          fi
          cd data
          git config user.name "samp-pulse-bot"
          git config user.email "samp-pulse-bot@users.noreply.github.com"
          git checkout -B data
          echo "папка данных готова: $(pwd), ветка: $(git branch --show-current || echo data)"

      - name: Собрать снимок
        run: |
          cd data
          python3 ../app/tools/snapshot.py

      - name: Записать в ветку data
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then
            echo "изменений нет, ничего не пишем"
            exit 0
          fi
          git commit -q -m "снимок $(date -u +'%Y-%m-%d %H:%M') UTC"
          if ! git push origin HEAD:data; then
            echo "первая попытка не прошла, подтягиваю свежее и повторяю"
            sleep 5
            git fetch -q origin data
            git rebase origin/data || git rebase --abort
            git push origin HEAD:data
          fi
          echo "готово: $(git log --oneline -1)"

  publish:
    name: сайт с данными
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Код сайта
        uses: actions/checkout@v4
        with:
          path: app

      - name: Свежие данные
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Собрать сайт с данными
        run: |
          mkdir -p _site/data
          cp app/index.html app/styles.css _site/
          cp app/robots.txt app/sitemap.xml _site/ 2>/dev/null || true
          cp -r app/js app/assets _site/
          find data -maxdepth 1 -type f \( -name "*.json" -o -name "*.jsonl" \) -exec cp {} _site/data/ \;
          echo "--- в сборке:"
          ls -la _site
          echo "--- данные:"
          ls -la _site/data

      - name: Подготовить Pages
        uses: actions/configure-pages@v5

      - name: Выложить сборку
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Опубликовать
        id: deploy
        uses: actions/deploy-pages@v4
